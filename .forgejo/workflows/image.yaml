on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: zot.c.p-mk1.sopho.tech

jobs:
  image:
    runs-on: docker
    container:
      image: infra-soph-ci-toolbox
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and push the pandora image to zot
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          image="$REGISTRY/apps/pandora:$version"
          latest="$REGISTRY/apps/pandora:latest"
          sha="$REGISTRY/apps/pandora:sha-${GITHUB_SHA:0:12}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://$REGISTRY/v2/apps/pandora/manifests/$version")
          case "$status" in
            200)
              release=no
              ;;
            404)
              release=yes
              ;;
            *)
              echo "could not tell whether $image exists: HTTP $status" >&2
              exit 1
              ;;
          esac
          docker build --network host --target prod -t "$image" -t "$latest" -t "$sha" .
          if [ "$release" = yes ]; then
            docker push "$image"
          else
            echo "$image already exists; a version tag is written once, by the release that cut it"
          fi
          docker push "$latest"
          docker push "$sha"
          echo "pushed $latest and $sha"
