name: scheduled

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: A CVE published since the last commit still lands on the tree
        run: just gh-audit

      - run: just vulns

      - run: just sbom

      - name: And on the published image, which was clean when it was built
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image:main"
