name: e2e

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: node
      - id: groups
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          HEAD_PUSH: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          BASE="$BASE_PUSH"
          HEAD="$HEAD_PUSH"
          if [ "$EVENT" = pull_request ]; then
            BASE="$BASE_PR"
            HEAD="$HEAD_PR"
          fi
          args=(--base "$BASE" --head "$HEAD")
          if [ "$EVENT" = push ]; then
            args+=(--push)
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            args+=(--push)
          fi
          selected=$(node e2e/scripts/select-groups.mjs "${args[@]}")
          echo "groups=$selected" >> "$GITHUB_OUTPUT"
          printf 'Selected groups: %s\n' "$selected" >> "$GITHUB_STEP_SUMMARY"

  suite-contract:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: node
      - run: just validate-e2e-suite

  kind:
    needs:
      - select
      - suite-contract
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.groups) }}
    env:
      PANDORA_KIND_CLUSTER: e2e-${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just node kind kubectl helm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: e2e-${{ runner.os }}-
      - name: Run the selected capability group
        env:
          E2E_GROUP: ${{ matrix.group }}
        run: just test-e2e-group "$E2E_GROUP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: e2e-${{ matrix.group }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.tmp/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: What the cluster said, if the lifecycle did not agree
        if: failure()
        run: just ci-kind-logs
      - name: Stop the kind cluster
        if: always()
        run: just ci-kind-down
