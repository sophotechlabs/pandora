{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "pandora.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secrets.secretKey }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "DJANGO_SECRET_KEY" | b64dec }}
{{- end }}
{{- if not $key }}
{{- $key = randAlphaNum 50 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pandora.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ $key | quote }}
{{- if .Values.superuser.enabled }}
  DJANGO_SUPERUSER_USERNAME: {{ .Values.superuser.username | quote }}
  DJANGO_SUPERUSER_EMAIL: {{ .Values.superuser.email | quote }}
{{- $password := .Values.superuser.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "DJANGO_SUPERUSER_PASSWORD" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
  DJANGO_SUPERUSER_PASSWORD: {{ $password | quote }}
{{- end }}
{{- end }}
